name: Security Audit

on:
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: 定时安全审计
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yaml
