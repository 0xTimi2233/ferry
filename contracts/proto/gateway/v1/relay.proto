// 转发与调度模块入站契约：发起模型调用与为一次请求选定凭证。
//
// 两个用例都没有自研管理端点。发起模型调用的入站承载面是跟随上游规范的协议原生端点，选定凭证是它的内部编排能力，
// 因此本文件只定义入站数据类型与出站数据形状，不定义 service，也不带路由注解。

syntax = "proto3";

package gateway.v1;

import "gateway/v1/common.proto";

// 发起模型调用的入站数据。
// 会话标识由入站适配器从请求头读取后填入，不随请求体传入。
message InvokeModelRequest {
  // 客户端请求的模型名。
  string alias = 1;
  // 客户端协议，由命中的协议端点决定。
  Protocol protocol = 2;
  bool stream = 3;
  // 会话标识，缺省表示本次调用不参与会话粘性。
  optional string session_id = 4;
  // 客户端协议报文的原始字节，网关不做解析。
  bytes payload = 5;
}

// 发起模型调用的出站数据，已转换为客户端协议形态的响应字节。
message InvokeModelResponse {
  bytes payload = 1;
}

// 选定凭证的入站数据。
message SelectCredentialRequest {
  string alias = 1;
  // 会话标识，缺省表示本次选定不参与会话粘性。
  optional string session_id = 2;
}

// 选定凭证的出站数据。
message SelectCredentialResponse {
  string credential_id = 1;
  // 本次选定是否命中会话粘性。
  bool affinity_hit = 2;
}
