// 凭证模块入站契约：凭证的登记、订阅授权、模型清单、健康状态与账号组策略。

syntax = "proto3";

package gateway.v1;

import "gateway/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// 凭证视图，对应出站查询类型的 CredentialView。
// 密钥只以掩码出现，明文不出现在任何响应中。
message CredentialView {
  string id = 1;
  string name = 2;
  CredentialKind kind = 3;
  string provider = 4;
  string group = 5;
  // 保留模型数量，由 kept_models 长度派生。
  uint32 kept_model_count = 6;
  string masked_secret = 7;
  repeated string kept_models = 8;
  HealthStatus health = 9;
  // 当月折算金额，订阅凭证不计价时为空。
  Money month_cost = 10;
}

// 凭证模块用例集合。
// 登录鉴权、请求 ID 与会话标识由入站适配器从请求头读取，不由消息字段承载。
service CredentialService {
  // 注册密钥凭证。
  rpc RegisterApiKeyCredential(RegisterApiKeyCredentialRequest) returns (RegisterApiKeyCredentialResponse) {
    option (google.api.http) = {
      post: "/admin/credential/credentials/api-key"
      body: "*"
    };
  }

  // 发起订阅授权。
  rpc StartSubscriptionAuthorization(StartSubscriptionAuthorizationRequest) returns (StartSubscriptionAuthorizationResponse) {
    option (google.api.http) = {
      post: "/admin/credential/credentials/subscription/authorizations"
      body: "*"
    };
  }

  // 完成订阅授权，由上游回调触发。
  rpc CompleteSubscriptionAuthorization(CompleteSubscriptionAuthorizationRequest) returns (CompleteSubscriptionAuthorizationResponse) {
    option (google.api.http) = {
      post: "/admin/credential/credentials/subscription/completion"
      body: "*"
    };
  }

  // 刷新订阅令牌，由自动刷新任务触发。
  rpc RefreshSubscriptionToken(RefreshSubscriptionTokenRequest) returns (RefreshSubscriptionTokenResponse) {
    option (google.api.http) = {
      post: "/admin/credential/credentials/{credential_id}/refresh"
      body: "*"
    };
  }

  // 拉取上游模型清单。
  rpc FetchUpstreamModels(FetchUpstreamModelsRequest) returns (FetchUpstreamModelsResponse) {
    option (google.api.http) = {
      get: "/admin/credential/credentials/{credential_id}/offered-models"
    };
  }

  // 选择保留的模型。
  rpc UpdateCredentialModels(UpdateCredentialModelsRequest) returns (UpdateCredentialModelsResponse) {
    option (google.api.http) = {
      patch: "/admin/credential/credentials/{credential_id}/kept-models"
      body: "*"
    };
  }

  // 启用或禁用凭证。
  rpc ChangeCredentialHealth(ChangeCredentialHealthRequest) returns (ChangeCredentialHealthResponse) {
    option (google.api.http) = {
      patch: "/admin/credential/credentials/{credential_id}/health"
      body: "*"
    };
  }

  // 删除凭证。
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse) {
    option (google.api.http) = {
      delete: "/admin/credential/credentials/{credential_id}"
    };
  }

  // 配置账号组。
  rpc ConfigureCredentialGroup(ConfigureCredentialGroupRequest) returns (ConfigureCredentialGroupResponse) {
    option (google.api.http) = {
      patch: "/admin/credential/groups/{group_id}"
      body: "*"
    };
  }

  // 查询凭证详情。
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse) {
    option (google.api.http) = {
      get: "/admin/credential/credentials/{credential_id}"
    };
  }

  // 查询凭证列表，同一响应附带账号组清单。
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option (google.api.http) = {
      get: "/admin/credential/credentials"
    };
  }
}

message RegisterApiKeyCredentialRequest {
  string name = 1;
  // 上游名称，受支持清单由领域校验。
  string provider = 2;
  // 密钥明文，只在本次请求出现。
  string secret = 3;
}

message RegisterApiKeyCredentialResponse {
  CredentialView credential = 1;
}

message StartSubscriptionAuthorizationRequest {
  string provider = 1;
}

message StartSubscriptionAuthorizationResponse {
  // 供浏览器打开的授权地址。
  string authorization_url = 1;
}

message CompleteSubscriptionAuthorizationRequest {
  // 待授权状态标识。
  string state = 1;
  // 上游回调携带的授权码。
  string code = 2;
}

message CompleteSubscriptionAuthorizationResponse {
  CredentialView credential = 1;
}

message RefreshSubscriptionTokenRequest {
  string credential_id = 1;
}

message RefreshSubscriptionTokenResponse {
  HealthStatus health = 1;
  // 下次刷新时间，访问令牌仍有效时被推迟。
  google.protobuf.Timestamp next_refresh_at = 2;
}

message FetchUpstreamModelsRequest {
  string credential_id = 1;
}

message FetchUpstreamModelsResponse {
  // 上游声明的模型清单。
  repeated string offered_models = 1;
  // 在本次拉取后仍然保留的模型。
  repeated string kept_models = 2;
}

message UpdateCredentialModelsRequest {
  string credential_id = 1;
  // 期望保留的模型清单，不得为空且必须全部在上游清单内。
  repeated string kept_models = 2;
}

message UpdateCredentialModelsResponse {
  repeated string kept_models = 1;
}

message ChangeCredentialHealthRequest {
  string credential_id = 1;
  // 启用为 true，禁用为 false。
  bool enabled = 2;
}

message ChangeCredentialHealthResponse {
  HealthStatus health = 1;
}

message DeleteCredentialRequest {
  string credential_id = 1;
}

message DeleteCredentialResponse {
  string credential_id = 1;
  // 组内最后一个凭证被删除时账号组一并移除。
  bool group_removed = 2;
}

message ConfigureCredentialGroupRequest {
  string group_id = 1;
  // 缺省表示该项不变。
  optional SelectionStrategy strategy = 2;
  // 缺省表示该项不变。
  optional uint32 max_concurrency = 3;
}

message ConfigureCredentialGroupResponse {
  CredentialGroupView group = 1;
}

message GetCredentialRequest {
  string credential_id = 1;
}

message GetCredentialResponse {
  CredentialView credential = 1;
}

message ListCredentialsRequest {
  // 缺省表示不按上游筛选。
  optional string provider = 1;
}

message ListCredentialsResponse {
  repeated CredentialView credentials = 1;
  repeated CredentialGroupView groups = 2;
}
